<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Mon compte – Panier Perdu</title>
<style>
:root{--encre:#0f3d33;--accent:#e8590c;--papier:#faf7f2;--texte:#1c1c1c;--gris:#5f6b66;--trait:#d9d3c8}
*{box-sizing:border-box;margin:0}
body{background:var(--papier);color:var(--texte);font:17px/1.5 -apple-system,system-ui,sans-serif;padding:24px 20px;max-width:520px;margin:0 auto}
h1,h2{font-family:Georgia,serif;color:var(--encre);line-height:1.15;margin:12px 0}
h2{font-size:28px}
.marque{font-size:13px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--encre)}
input{width:100%;font:inherit;padding:14px;border:1px solid var(--trait);border-radius:6px;margin:12px 0;background:#fff}
button,a.b{display:block;width:100%;text-align:center;background:var(--accent);color:#fff;font-family:inherit;font-weight:700;font-size:18px;padding:15px;border:0;border-radius:6px;cursor:pointer;text-decoration:none}
.l{background:none;color:var(--gris);font-weight:400;text-decoration:underline;margin-top:12px;font-size:15px}
.bloc{background:#fff;border:1px solid var(--trait);border-radius:6px;padding:18px;margin:16px 0}
.bloc h3{font-size:14px;text-transform:uppercase;letter-spacing:.04em;color:var(--gris);margin-bottom:6px}
.grand{font:700 44px Georgia,serif;color:var(--encre)}
.n{color:var(--gris);font-size:14px;margin-top:8px}
</style></head><body>
<main id="app"><p class="n">Chargement…</p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.js"></script>
<script src="compte.js"></script>
</body></html>
