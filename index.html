<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panier Perdu – Récupère les paniers abandonnés de ta boutique</title>
<meta name="description" content="Deux relances automatiques pour récupérer les paniers abandonnés de ta boutique Shopify ou WooCommerce, sans payer le prix des grosses solutions.">
<meta property="og:type" content="website">
<meta property="og:title" content="Panier Perdu – Récupère les paniers abandonnés de ta boutique">
<meta property="og:description" content="Deux relances automatiques pour les petites boutiques Shopify et WooCommerce.">
<meta name="theme-color" content="#0f3d33">
<style>
  :root { --encre:#0f3d33; --accent:#e8590c; --papier:#faf7f2; --texte:#1c1c1c; --gris:#5f6b66; --trait:#d9d3c8; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--papier); color:var(--texte); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; font-size:18px; line-height:1.5; }
  main { max-width:640px; margin:0 auto; padding:28px 20px 48px; }
  .marque { font-weight:700; letter-spacing:.04em; text-transform:uppercase; font-size:14px; color:var(--encre); }
  h1 { font-family:Georgia,"Times New Roman",serif; font-size:30px; line-height:1.15; color:var(--encre); margin:16px 0 14px; }
  h2 { font-family:Georgia,serif; font-size:26px; line-height:1.2; color:var(--encre); margin-bottom:16px; }
  .sous-titre { color:var(--gris); margin-bottom:24px; }
  .bouton { display:block; width:100%; text-align:center; background:var(--accent); color:#fff; font-weight:700; font-size:19px; padding:16px 20px; border-radius:6px; min-height:56px; border:0; cursor:pointer; font-family:inherit; }
  .reponse { display:block; width:100%; text-align:left; background:#fff; color:var(--encre); font-weight:600; font-size:18px; padding:16px 18px; border-radius:6px; border:2px solid var(--trait); min-height:56px; margin-bottom:12px; cursor:pointer; font-family:inherit; }
  .note { text-align:center; color:var(--gris); font-size:14px; margin-top:10px; }
  .douleur { background:var(--encre); color:#fff; padding:24px 20px; border-radius:6px; margin:36px 0; }
  .douleur .chiffre { font-family:Georgia,serif; font-size:40px; font-weight:700; color:#ffd8b8; line-height:1.05; }
  .douleur p { margin-top:10px; }
  .douleur small { display:block; margin-top:14px; font-size:13px; opacity:.8; }
  ul { list-style:none; }
  li { padding:16px 0; border-top:1px solid var(--trait); }
  li strong { display:block; color:var(--encre); font-size:19px; margin-bottom:2px; }
  li span { color:var(--gris); font-size:16px; }
  .barre { height:8px; background:var(--trait); border-radius:4px; margin:14px 0 8px; overflow:hidden; }
  .barre i { display:block; height:100%; background:var(--accent); }
  .etape { color:var(--gris); font-size:14px; margin-bottom:22px; }
  .retour { background:none; border:0; color:var(--gris); font-size:15px; margin-top:12px; cursor:pointer; font-family:inherit; text-decoration:underline; }
  .grand { font-family:Georgia,serif; font-size:48px; font-weight:700; color:var(--accent); line-height:1.05; }
  .bloc { background:#fff; border:1px solid var(--trait); border-radius:6px; padding:18px; margin:18px 0; }
  .bloc h3 { font-size:15px; text-transform:uppercase; letter-spacing:.04em; color:var(--gris); margin-bottom:8px; }
  .mail { font-size:16px; white-space:pre-line; }
  .verrou { position:relative; }
  .verrou .flou { filter:blur(5px); user-select:none; pointer-events:none; }
  .verrou .cadenas { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-weight:700; color:var(--encre); text-align:center; padding:12px; }
  footer { margin-top:40px; font-size:13px; color:var(--gris); text-align:center; }
</style>
</head>
<body>
<main id="app"></main>
<script src="a.js"></script>
<script src="b.js"></script>
</body>
</html>
